# Production MQTT configuration - no anonymous access, TLS enforced
# Mount this as /mosquitto/config/mosquitto.conf in production
#
# To activate: set MQTT_PROD_MODE=true in your environment.
# The entrypoint copies this file over mosquitto.conf before Mosquitto starts.
# Provide TLS certificates at:
#   infra/certs/ca.crt, infra/certs/server.crt, infra/certs/server.key
# (run scripts/gen-self-signed-cert.sh for a local self-signed set)
# See docs/security.md for the full production checklist.

# MQTTS listener (TLS)
listener 8883 0.0.0.0
protocol mqtt

# Disable anonymous access
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS configuration
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

# Persistence disabled (stateless replay)
persistence false
retain_available true
max_queued_messages 10000
max_inflight_messages 100
message_size_limit 1048576
sys_interval 10
log_dest stdout
log_type error
log_type warning
log_type notice
