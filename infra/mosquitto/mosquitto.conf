# ╔══════════════════════════════════════════════════════════════════════════╗
# ║              DEVELOPMENT CONFIGURATION — NOT FOR PRODUCTION             ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  This file is used by the Docker build when PROD_MODE is false (the     ║
# ║  default). It allows anonymous reads so that local development and the  ║
# ║  README's one-liner `mosquitto_sub -h localhost -p 1883 -t 'plant/#'`   ║
# ║  work without any setup.                                                ║
# ║                                                                         ║
# ║  DO NOT deploy this configuration in production:                        ║
# ║    • allow_anonymous true lets any network client subscribe to all      ║
# ║      plant telemetry, decisions and alerts without a credential.        ║
# ║    • The broker listens on plain MQTT (port 1883) with no TLS.          ║
# ║                                                                         ║
# ║  To switch to production mode:                                          ║
# ║    1. Set MQTT_PROD_MODE=true in your .env.                             ║
# ║    2. Provide TLS certificates in infra/certs/ (see docs/security.md). ║
# ║    3. The entrypoint will activate mosquitto.prod.conf automatically,   ║
# ║       which enforces authentication on port 8883 with TLS.              ║
# ╚══════════════════════════════════════════════════════════════════════════╝
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
retain_available true
max_queued_messages 10000
max_inflight_messages 100
message_size_limit 1048576
sys_interval 10
log_dest stdout
log_type error
log_type warning
log_type notice
