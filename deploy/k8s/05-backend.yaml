apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fault-diagnosis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/arunpune/fdp-backend:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: fdp-config
          env:
            - name: PG_HOST
              value: "postgres"
            - name: PG_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "fdp"
            - name: PG_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fdp-secrets
                  key: PG_APP_PASSWORD
            - name: MQTT_BACKEND_DIAG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fdp-secrets
                  key: MQTT_BACKEND_DIAG_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fdp-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: fdp-secrets
                  key: JWT_EXPIRES_IN
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fault-diagnosis
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
