apiVersion: v1
kind: ConfigMap
metadata:
  name: fdp-config
  namespace: fault-diagnosis
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DECISION_BACKEND: "von"
  TYPESAFE_BASE_URL: "http://von:8000"
  VON_MODEL: "von-1.3.0"
  UNIT_ID: "cau-7"
  MQTT_URL: "mqtt://mqtt:1883"
  MODBUS_ADDR: "192.168.1.100:502"
  POLL_INTERVAL_MS: "100"
  GATE_PERSIST_SIM_MIN: "1"
  VON_GATE_REVIEW_MIN_CONFIDENCE: "0.65"
  VON_GATE_TICKET_MIN_CONFIDENCE: "0.85"
---
apiVersion: v1
kind: Secret
metadata:
  name: fdp-secrets
  namespace: fault-diagnosis
type: Opaque
stringData:
  POSTGRES_USER: "fdp_admin"
  POSTGRES_PASSWORD: "change-me-postgres-password-prod"
  PG_APP_PASSWORD: "change-me-app-rw-password-prod"
  PG_GT_PASSWORD: "change-me-gt-rw-password-prod"
  MQTT_GATEWAY_PASSWORD: "change-me-gateway-password-prod"
  MQTT_BACKEND_DIAG_PASSWORD: "change-me-backend-password-prod"
  MQTT_BACKEND_OPS_PASSWORD: "change-me-ops-password-prod"
  TYPESAFE_API_KEY: ""
  JWT_SECRET: "change-me-to-a-secure-32-character-minimum-hex-secret"
  JWT_EXPIRES_IN: "8h"
